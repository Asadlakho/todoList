<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo List - Asad Ali</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://kit.fontawesome.com/b2b731f521.js" crossorigin="anonymous"></script>
  <style>
    body {
      overflow: hidden;
    }

    #list li {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(8px);
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 0.75rem;
      margin-top: 0.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    #list li button {
      background: linear-gradient(90deg, #ef4444, #a3356e);
      color: white;
      padding: 0.25rem 0.75rem;
      border-radius: 0.5rem;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.25rem;
      transition: all 0.3s ease;
    }

    #list li button:hover {
      background: linear-gradient(90deg, #f472b6, #ef4444);
    }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-900 via-sky-900 to-gray-900 flex flex-col items-center justify-center p-6">

  <h1 class="text-3xl font-bold text-white bg-gradient-to-r from-blue-600 to-sky-500 px-10 py-3 rounded-2xl shadow-xl mb-8 flex items-center gap-2">
    <i class="fa-solid fa-list-check"></i> Todo <span style="color: beige;">List</span>
  </h1>

  <div class="flex w-full max-w-md gap-3 mb-4">
    <input type="text" id="task" placeholder="Enter your data"
           class="flex-1 px-4 py-2 rounded-lg outline-none bg-gray-100 focus:ring-2 focus:ring-sky-500 text-gray-800 placeholder-gray-500 shadow-md">
    <button onclick="add()"
            class="bg-gradient-to-r from-blue-600 to-sky-500 hover:from-sky-500 hover:to-blue-600 text-white font-semibold px-4 py-2 rounded-lg transition duration-300 shadow-lg cursor-pointer flex items-center gap-2">
            <i class="fa-solid fa-plus"></i> Add Data
    </button>
  </div>

  <ul id="list" class="mt-6 space-y-3 w-full max-w-md text-left"></ul>

  <script>
    const add = () => {
      let task = document.getElementById("task").value;
      if (task === "") return;
      let listItem = document.createElement("li");
      listItem.innerHTML = task + " <button onclick='this.parentElement.remove()'><i class=\"fa-solid fa-trash\"></i> Remove</button>";
      document.getElementById("list").append(listItem);
      document.getElementById("task").value = "";
    }
  </script>

</body>
</html>
